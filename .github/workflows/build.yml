name: Build APK

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build unsigned debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FireOS-AVOD-debug-${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{printf "%02d%02d%02d%02d", $1 % 100, $2, $3, $4}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (versionCode $VERSION_CODE)"

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_BASE64 environment secret}"
          : "${RELEASE_STORE_PASSWORD:?Missing RELEASE_STORE_PASSWORD environment secret}"
          : "${RELEASE_KEY_ALIAS:?Missing RELEASE_KEY_ALIAS environment secret}"
          : "${RELEASE_KEY_PASSWORD:?Missing RELEASE_KEY_PASSWORD environment secret}"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avod-release.jks"
          test -s "$RUNNER_TEMP/avod-release.jks"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/avod-release.jks"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionNameOverride="${{ steps.version.outputs.version }}" \
            -PversionCodeOverride="${{ steps.version.outputs.version_code }}"

      - name: Rename APK with version
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/FireOS-AVOD-${{ steps.version.outputs.version }}.apk"

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/FireOS-AVOD-${{ steps.version.outputs.version }}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Clean up signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/avod-release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FireOS-AVOD-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/FireOS-AVOD-*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          name: Release ${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/release/FireOS-AVOD-*.apk
          generate_release_notes: true
